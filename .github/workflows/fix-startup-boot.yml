name: Fix startup boot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch startup so Firebase can never block the UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Replace the blocking Firebase-only startup call with an immediate local auth boot plus timeout fallback.
          old = 'loadFirebase(()=>{ testSync(); initAuth(); });'
          new = '''loadFirebase(()=>{\n  try{ testSync(); }catch(e){}\n  try{ initAuth(); }catch(e){ console.warn('Tyga auth boot error', e); }\n});\n// Never leave the user on “Checking device sync…” if Firebase/network startup is unavailable.\nsetTimeout(()=>{\n  try{\n    const status=document.getElementById('authSyncStatus');\n    const body=document.getElementById('authBody');\n    if(typeof authView !== 'undefined' && authView === 'loading'){\n      authView='chooser';\n      if(typeof renderAuth === 'function') renderAuth();\n    }\n    if(status && (!body || body.children.length===0)){\n      status.textContent='Device sync unavailable — continuing on this device';\n      status.style.color='var(--wait)';\n      if(typeof authView !== 'undefined'){ authView='chooser'; if(typeof renderAuth === 'function') renderAuth(); }\n    }\n  }catch(e){ console.warn('Tyga startup recovery', e); }\n}, 3000);'''
          if old in s:
              s = s.replace(old, new, 1)

          # Also make the direct page shell self-recovering even when an old service worker is serving index.html.
          marker = 'TYGA_STARTUP_EMERGENCY_V38'
          emergency = '''<script id="tygaEmergencyBoot">\n(()=>{\n  const run=()=>setTimeout(()=>{\n    try{\n      const status=document.getElementById('authSyncStatus');\n      const body=document.getElementById('authBody');\n      if(status && body && body.children.length===0){\n        status.textContent='Device sync unavailable — continuing on this device';\n        status.style.color='var(--wait)';\n        if(typeof authView!=='undefined'){ authView='chooser'; }\n        if(typeof renderAuth==='function') renderAuth();\n      }\n    }catch(_){}\n  },4000);\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run,{once:true}); else run();\n})();\n</script>'''
          if marker not in s:
              s = s.replace('</head>', f'<meta name="{marker}" content="1">{emergency}</head>', 1)

          # Bust all directly loaded runtime scripts.
          s = s.replace('?v=36', '?v=38')
          p.write_text(s, encoding='utf-8')
      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: prevent Firebase sync from blocking app startup"
          git push
