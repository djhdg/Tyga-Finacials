name: Fix startup boot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch Firebase startup so auth never waits forever
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "loadFirebase(()=>{ testSync(); initAuth(); });"
          new = r'''let __tygaAuthBooted = false;
function __tygaBootAuth(){
  if(__tygaAuthBooted) return;
  __tygaAuthBooted = true;
  try{ testSync(); }catch(e){ console.warn('Tyga sync check skipped', e); }
  try{ initAuth(); }catch(e){
    console.error('Tyga auth boot failed', e);
    __tygaAuthBooted = false;
    setTimeout(__tygaBootAuth, 500);
  }
}
// Firebase is optional for startup. Never keep the entire application behind a remote SDK.
loadFirebase(__tygaBootAuth);
setTimeout(__tygaBootAuth, 2500);'''
          if old in s:
              s = s.replace(old, new, 1)
          # Bust direct browser caches for the injected scripts.
          s = s.replace('?v=36', '?v=37')
          marker = 'TYGA_STARTUP_BOOT_V37'
          if marker not in s:
              s = s.replace('</head>', f'<meta name="{marker}" content="1"></head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: boot auth without waiting for Firebase"
          git push
