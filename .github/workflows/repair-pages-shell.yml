name: Repair Pages runtime shell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add v37 startup recovery and clear stale PWA workers
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- TYGA_RUNTIME_SHELL_V37 -->'
          if marker not in s:
              block = '''
<!-- TYGA_RUNTIME_SHELL_V37 -->
<script>
(() => {
  const KEY='tyga-runtime-v37-reset';
  if(!sessionStorage.getItem(KEY)){
    sessionStorage.setItem(KEY,'1');
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>caches?.keys?.().then(ks=>Promise.all(ks.map(k=>caches.delete(k))))).catch(()=>{});
    }
  }
})();
</script>
<script src="./startup-recovery.js?v=37" defer></script>
'''
              s = s.replace('</head>', block + '</head>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit repaired shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: v37 startup recovery for Firebase sync hang'
          git push
