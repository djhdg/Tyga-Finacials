name: Tyga scalping validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check scalping-strategies.js
      - run: node --check scalping-quality.js
      - run: node --check scalping-analytics.js
      - run: node --check scalping-execution-quality.js
      - run: node --check scalping-robustness.js
      - run: node --check deriv-buy-fix.js
      - run: node --check execution-controls.js
      - run: node --check trading-safety.js
      - run: node --check execution-guard.js
      - run: node tests/scalping-selftest.mjs
